<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- People holding hands in a circle -->
  <g transform="translate(20, 20)">
    <!-- Person 1 (top) -->
    <g transform="translate(0, -12)">
      <circle cx="0" cy="-2" r="2" fill="#14f195"/>
      <path d="M-2 3 L0 0 L2 3" stroke="#14f195" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <!-- Person 2 (top-right) -->
    <g transform="translate(8.5, -8.5) rotate(45)">
      <circle cx="0" cy="-2" r="2" fill="#14f195"/>
      <path d="M-2 3 L0 0 L2 3" stroke="#14f195" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <!-- Person 3 (right) -->
    <g transform="translate(12, 0) rotate(90)">
      <circle cx="0" cy="-2" r="2" fill="#14f195"/>
      <path d="M-2 3 L0 0 L2 3" stroke="#14f195" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <!-- Person 4 (bottom-right) -->
    <g transform="translate(8.5, 8.5) rotate(135)">
      <circle cx="0" cy="-2" r="2" fill="#14f195"/>
      <path d="M-2 3 L0 0 L2 3" stroke="#14f195" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <!-- Person 5 (bottom) -->
    <g transform="translate(0, 12) rotate(180)">
      <circle cx="0" cy="-2" r="2" fill="#14f195"/>
      <path d="M-2 3 L0 0 L2 3" stroke="#14f195" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <!-- Person 6 (bottom-left) -->
    <g transform="translate(-8.5, 8.5) rotate(225)">
      <circle cx="0" cy="-2" r="2" fill="#14f195"/>
      <path d="M-2 3 L0 0 L2 3" stroke="#14f195" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <!-- Person 7 (left) -->
    <g transform="translate(-12, 0) rotate(270)">
      <circle cx="0" cy="-2" r="2" fill="#14f195"/>
      <path d="M-2 3 L0 0 L2 3" stroke="#14f195" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <!-- Person 8 (top-left) -->
    <g transform="translate(-8.5, -8.5) rotate(315)">
      <circle cx="0" cy="-2" r="2" fill="#14f195"/>
      <path d="M-2 3 L0 0 L2 3" stroke="#14f195" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <!-- Circle connecting them (holding hands) -->
    <circle cx="0" cy="0" r="10" stroke="#14f195" stroke-width="2" fill="none" stroke-dasharray="2 2"/>
  </g>
</svg>

