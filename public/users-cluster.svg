<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Two people holding hands -->
  <g transform="translate(20, 20)">
    <!-- Left person -->
    <g transform="translate(-7, 0)">
      <!-- Head -->
      <circle cx="0" cy="-4" r="3" fill="none" stroke="#14f195" stroke-width="2"/>
      <!-- Body -->
      <line x1="0" y1="-1" x2="0" y2="5" stroke="#14f195" stroke-width="2" stroke-linecap="round"/>
      <!-- Left arm (hand extended to hold) -->
      <line x1="0" y1="1" x2="4" y2="1" stroke="#14f195" stroke-width="2" stroke-linecap="round"/>
      <!-- Right arm -->
      <line x1="0" y1="1" x2="-3" y2="3" stroke="#14f195" stroke-width="2" stroke-linecap="round"/>
      <!-- Left leg -->
      <line x1="0" y1="5" x2="-2" y2="9" stroke="#14f195" stroke-width="2" stroke-linecap="round"/>
      <!-- Right leg -->
      <line x1="0" y1="5" x2="2" y2="9" stroke="#14f195" stroke-width="2" stroke-linecap="round"/>
    </g>
    
    <!-- Right person -->
    <g transform="translate(7, 0)">
      <!-- Head -->
      <circle cx="0" cy="-4" r="3" fill="none" stroke="#14f195" stroke-width="2"/>
      <!-- Body -->
      <line x1="0" y1="-1" x2="0" y2="5" stroke="#14f195" stroke-width="2" stroke-linecap="round"/>
      <!-- Right arm (hand extended to hold) -->
      <line x1="0" y1="1" x2="-4" y2="1" stroke="#14f195" stroke-width="2" stroke-linecap="round"/>
      <!-- Left arm -->
      <line x1="0" y1="1" x2="3" y2="3" stroke="#14f195" stroke-width="2" stroke-linecap="round"/>
      <!-- Left leg -->
      <line x1="0" y1="5" x2="-2" y2="9" stroke="#14f195" stroke-width="2" stroke-linecap="round"/>
      <!-- Right leg -->
      <line x1="0" y1="5" x2="2" y2="9" stroke="#14f195" stroke-width="2" stroke-linecap="round"/>
    </g>
    
    <!-- Holding hands - connecting line -->
    <line x1="-3" y1="1" x2="3" y2="1" stroke="#14f195" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
